name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Create export templates directory
        run: mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable

      - name: Download Godot export templates
        run: |
          cd ~/.local/share/godot/export_templates/4.7.1.stable
          wget https://github.com/godotengine/godot-releases/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export-templates.tpz
          unzip -q Godot_v4.7.1-stable_export-templates.tpz
          rm Godot_v4.7.1-stable_export-templates.tpz

      - name: Build Linux (x86_64)
        run: |
          mkdir -p builds/linux
          godot --export-release "Linux (x86_64)" builds/linux/AllegoryCave.x86_64

      - name: Build Windows (x86_64)
        run: |
          mkdir -p builds/windows
          godot --export-release "Windows (x86_64)" builds/windows/AllegoryCave.exe

      - name: Build macOS (ARM64)
        run: |
          mkdir -p builds/macos
          godot --export-release "macOS (ARM64)" builds/macos/AllegoryCave.dmg

      - name: Create release artifacts
        run: |
          cd builds
          tar -czf linux/AllegoryCave-linux.tar.gz -C linux AllegoryCave.x86_64
          zip -r windows/AllegoryCave-windows.zip windows/AllegoryCave.exe
          tar -czf macos/AllegoryCave-macos.tar.gz -C macos AllegoryCave.dmg

      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            builds/linux/AllegoryCave-linux.tar.gz \
            builds/windows/AllegoryCave-windows.zip \
            builds/macos/AllegoryCave-macos.tar.gz \
            --clobber
