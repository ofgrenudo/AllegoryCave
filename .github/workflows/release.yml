name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Build Linux (x86_64)
        run: |
          mkdir -p builds/linux
          godot --headless --export-release "Linux" builds/linux/AllegoryCave.x86_64

      - name: Build Windows (x86_64)
        run: |
          mkdir -p builds/windows
          godot --headless --export-release "Windows Desktop" builds/windows/AllegoryCave.exe

      - name: Build macOS (arm64)
        run: |
          mkdir -p builds/macos
          godot --headless --export-release "macOS" builds/macos/AllegoryCave.zip

      - name: Build Web
        run: |
          mkdir -p builds/web
          godot --headless --export-release "Web" builds/web/index.html

      - name: Create release artifacts
        run: |
          cd builds
          tar -czf linux/AllegoryCave-linux.tar.gz -C linux AllegoryCave.x86_64
          zip -r windows/AllegoryCave-windows.zip windows/AllegoryCave.exe
          mv macos/AllegoryCave.zip macos/AllegoryCave-macos.zip
          zip -r AllegoryCave-web.zip web

      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            builds/linux/AllegoryCave-linux.tar.gz \
            builds/windows/AllegoryCave-windows.zip \
            builds/macos/AllegoryCave-macos.zip \
            builds/AllegoryCave-web.zip \
            --clobber
